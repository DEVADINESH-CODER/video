name: Clone voice

# Dedicated, opt-in voice pipeline. It reads episodes/<episode>/script.json,
# clones assets/my_voice_ref.wav with Chatterbox and writes
# public/audio/<episode>_voice.wav + <episode>_timings.json, then optionally
# commits them so the render workflow picks the voice up automatically.
#
# GitHub's CPU runners work but are slow; for a free T4 GPU run the same script
# from notebooks/clone_voice.ipynb in Colab instead.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder under episodes/ (e.g. ep01)"
        required: true
        default: "ep01"
        type: string
      reference:
        description: "Voice sample to clone"
        required: true
        default: "assets/my_voice_ref.wav"
        type: string
      commit:
        description: "Commit and push the generated voiceover"
        required: false
        default: true
        type: boolean

concurrency:
  group: voice-${{ github.event.inputs.episode || 'ep01' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  EPISODE: ${{ github.event.inputs.episode || 'ep01' }}
  REFERENCE: ${{ github.event.inputs.reference || 'assets/my_voice_ref.wav' }}

jobs:
  clone:
    name: ${{ github.event.inputs.episode || 'ep01' }} · chatterbox
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate episode
        run: |
          set -euo pipefail
          if [[ ! "$EPISODE" =~ ^ep[0-9]+$ ]]; then
            echo "::error::episode must look like ep01 (got '$EPISODE')"
            exit 1
          fi
          test -f "episodes/$EPISODE/script.json" || {
            echo "::error::episodes/$EPISODE/script.json does not exist"
            exit 1
          }
          test -f "$REFERENCE" || {
            echo "::error::$REFERENCE does not exist — upload your ~30 s voice sample first"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Chatterbox
        run: |
          python -m pip install --upgrade pip
          pip install chatterbox-tts pydub

      - name: Generate voiceover
        run: python scripts/generate_voice.py --episode "$EPISODE" --reference "$REFERENCE"

      - name: Show timings
        run: cat "public/audio/${EPISODE}_timings.json"

      - name: Upload voiceover
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-${{ env.EPISODE }}
          path: |
            public/audio/${{ env.EPISODE }}_voice.wav
            public/audio/${{ env.EPISODE }}_timings.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit voiceover
        if: inputs.commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/audio/${EPISODE}_voice.wav" "public/audio/${EPISODE}_timings.json"
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Add cloned voiceover for ${EPISODE}"
          git push
