name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition ID to render
        required: false
        default: Episode1
        type: string
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"

permissions:
  contents: read

env:
  COMPOSITION: ${{ github.event.inputs.composition || 'Episode1' }}

jobs:
  render:
    name: Render ${{ github.event.inputs.composition || 'Episode1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read Remotion version
        id: remotion
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/remotion'].version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # Remotion caches the Chrome Headless Shell in node_modules/.remotion, so
      # this has to run after `npm ci`, which recreates node_modules.
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ steps.remotion.outputs.version }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-

      - name: Ensure Chromium
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render "$COMPOSITION" "out/$COMPOSITION.mp4" --concurrency=100%

      # Frames in the rendered MP4 map 1:1 to Remotion frames, so the stills are
      # pulled in a single fast ffmpeg pass instead of booting Chromium 7 times.
      - name: Extract keyframe stills
        run: |
          mkdir -p out/stills
          ffmpeg -hide_banner -loglevel error -y -i "out/$COMPOSITION.mp4" \
            -vf "select='eq(n,60)+eq(n,220)+eq(n,480)+eq(n,780)+eq(n,1020)+eq(n,1240)+eq(n,1550)'" \
            -fps_mode vfr "out/stills/frame-%02d.png"

      - name: Upload MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Upload keyframe stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyframe-stills
          path: out/stills/
          if-no-files-found: warn
          retention-days: 14
