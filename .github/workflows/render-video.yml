name: Render video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stills_only (fast scene check) or full_video"
        required: true
        default: stills_only
        type: choice
        options:
          - stills_only
          - full_video
      composition:
        description: Composition ID to render
        required: false
        default: Episode1
        type: string
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"

permissions:
  contents: read

env:
  COMPOSITION: ${{ github.event.inputs.composition || 'Episode1' }}
  MODE: ${{ github.event.inputs.mode || 'full_video' }}

jobs:
  render:
    name: ${{ github.event.inputs.mode || 'full_video' }} · ${{ github.event.inputs.composition || 'Episode1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read Remotion version
        id: remotion
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/remotion'].version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # Remotion stores the Chrome Headless Shell in node_modules/.remotion, so
      # this runs after `npm ci`, which recreates node_modules.
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ steps.remotion.outputs.version }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-

      - name: Ensure Chromium
        run: npx remotion browser ensure

      # Stills-first: one still per scene, before any MP4 encode is paid for.
      - name: Render scene preview stills
        if: env.MODE == 'stills_only'
        run: |
          mkdir -p out/stills
          for frame in 60 220 480 700 840 1020 1550; do
            npx remotion still "$COMPOSITION" "out/stills/frame-$frame.png" --frame="$frame"
          done

      - name: Render video
        if: env.MODE == 'full_video'
        run: npx remotion render "$COMPOSITION" "out/$COMPOSITION.mp4" --concurrency=100%

      # Pull the same frames out of the finished MP4 in one pass, so a full
      # render also ships inspectable stills without booting Chromium again.
      - name: Extract keyframe stills
        if: env.MODE == 'full_video'
        run: |
          mkdir -p out/stills
          ffmpeg -hide_banner -loglevel error -y -i "out/$COMPOSITION.mp4" \
            -vf "select='eq(n,60)+eq(n,220)+eq(n,480)+eq(n,700)+eq(n,840)+eq(n,1020)+eq(n,1550)'" \
            -fps_mode vfr "out/stills/frame-%02d.png"

      - name: Upload scene preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-preview-images
          path: out/stills/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload MP4
        if: always() && env.MODE == 'full_video'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*.mp4
          if-no-files-found: warn
          retention-days: 14
