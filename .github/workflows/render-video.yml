name: Render video

# One-click cloud render. Pick a composition (default Episode1) and Run workflow.
# The build is cached, so a 58 s vertical episode typically finishes in ~60–90 s
# on a warm runner.

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id to render"
        required: true
        default: "Episode1"
        type: string
      mode:
        description: "full_video (MP4 + stills) or stills_only (fast layout check)"
        required: true
        default: full_video
        type: choice
        options:
          - full_video
          - stills_only

permissions:
  contents: read

env:
  COMPOSITION: ${{ github.event.inputs.composition || 'Episode1' }}
  MODE: ${{ github.event.inputs.mode || 'full_video' }}

jobs:
  render:
    name: ${{ github.event.inputs.composition || 'Episode1' }} · ${{ github.event.inputs.mode || 'full_video' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate composition id
        run: |
          set -euo pipefail
          if [[ ! "$COMPOSITION" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::composition must contain only letters, numbers, - or _ (got '$COMPOSITION')"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read Remotion version
        id: remotion
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/remotion'].version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # npm's cache is wired up by setup-node; this one holds Remotion's own
      # browser/compositor cache so a warm run does not re-download Chrome.
      - name: Cache Remotion
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-cache-${{ runner.os }}-${{ steps.remotion.outputs.version }}
          restore-keys: |
            remotion-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Ensure Chromium
        run: npx remotion browser ensure

      - name: Typecheck
        run: npx tsc --noEmit

      # ubuntu-latest does not ship ffmpeg, and Remotion's bundled binary is
      # built without filters, so the system build is required for `select`.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Render video
        if: env.MODE == 'full_video'
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render "$COMPOSITION" "out/$COMPOSITION.mp4" --concurrency=100%

      - name: Render stills without an MP4
        if: env.MODE == 'stills_only'
        run: |
          set -euo pipefail
          mkdir -p out/preview-stills
          for frame in 80 240 500 720 850 1040 1260 1580; do
            npx remotion still "$COMPOSITION" "out/preview-stills/frame-$frame.png" --frame="$frame"
          done

      # Pull the same eight story beats out of the finished MP4 in one decode
      # pass, then give each PNG its real frame number.
      - name: Extract keyframe stills
        if: env.MODE == 'full_video'
        run: |
          set -euo pipefail
          mkdir -p out/preview-stills
          ffmpeg -hide_banner -loglevel error -y -i "out/$COMPOSITION.mp4" \
            -vf "select='eq(n\,80)+eq(n\,240)+eq(n\,500)+eq(n\,720)+eq(n\,850)+eq(n\,1040)+eq(n\,1260)+eq(n\,1580)'" \
            -fps_mode vfr "out/preview-stills/extracted-%02d.png"
          frames=(80 240 500 720 850 1040 1260 1580)
          i=1
          for frame in "${frames[@]}"; do
            mv "out/preview-stills/extracted-$(printf '%02d' "$i").png" "out/preview-stills/frame-$frame.png"
            i=$((i + 1))
          done
          ls -lh out/preview-stills

      - name: Upload keyframe stills
        uses: actions/upload-artifact@v4
        with:
          name: keyframe-stills
          path: out/preview-stills/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload rendered video
        if: env.MODE == 'full_video'
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/${{ env.COMPOSITION }}.mp4
          if-no-files-found: error
          retention-days: 14
